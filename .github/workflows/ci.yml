name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The installer writes real paths on three operating systems, so it is worth proving
      # it on all three rather than on the one it was written on.
      - name: Lint the skills
        run: npm run lint

      - name: Test
        run: npm test
